services:
  - type: web
    name: vendeya-cloud
    runtime: docker
    plan: starter
    region: oregon
    dockerContext: .
    dockerfilePath: ./src/server/cloud/deploy/Dockerfile
    healthCheckPath: /health
    envVars:
      - key: CLOUD_DATABASE_URL
        fromDatabase:
          name: vendeya-cloud-db
          property: connectionString
      - key: LICENSE_SIGNING_KEY_BASE64
        sync: false
databases:
  - name: vendeya-cloud-db
    plan: basic-256mb
    region: oregon
    postgresMajorVersion: "17"
    ipAllowList: []
