name: Release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  LICENSE_SERVER_URL: ${{ vars.LICENSE_SERVER_URL }}
  LICENSE_PUBLIC_KEY_BASE64: ${{ vars.LICENSE_PUBLIC_KEY_BASE64 }}
  TELEMETRY_URL: ${{ vars.TELEMETRY_URL }}

jobs:
  verificar:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: |
          npx tsc --noEmit
          npx tsc --noEmit -p tsconfig.node.json
          npx tsc --noEmit -p tsconfig.electron.json
      - run: npm test
      - run: npm run lint

  windows:
    needs: verificar
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: |
          npx ts-node --project tsconfig.node.json electron/updater/release/artefactos.ts config
          npm run prisma:generate
          npm run build:main
          npm run build:vite
      - name: Firmar candidato y versión base para la VM
        shell: pwsh
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          npm run build:release:win
          npm version 0.9.99 --no-git-tag-version
          npm run build:release:win -- --config.directories.output=smoke-baseline
          git restore -- package.json package-lock.json
          Copy-Item 'smoke-baseline/vendeyapos-Setup-0.9.99.exe' 'release/baseline.exe'
          $files = @(Get-ChildItem -Path release -Filter '*.exe' -File)
          if ($files.Count -ne 2) { throw 'Expected candidate installer and baseline' }
          foreach ($file in $files) {
            $sig = Get-AuthenticodeSignature -LiteralPath $file.FullName
            if ($sig.Status -ne 'Valid' -or -not $sig.TimeStamperCertificate) {
              throw "Installer signature or timestamp invalid: $($file.Name)"
            }
          }
          npx ts-node --project tsconfig.node.json electron/updater/release/artefactos.ts windows release
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: |
            release/*.exe
            release/*.yml
            release/*.blockmap
            release/signing.json
          if-no-files-found: error
          retention-days: 30

  macos:
    needs: verificar
    runs-on: macos-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: |
          npx ts-node --project tsconfig.node.json electron/updater/release/artefactos.ts config
          npm run prisma:generate
          npm run build:main
          npm run build:vite
      - name: Firmar, notarizar con notarytool y validar
        shell: bash
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          node electron/updater/verificarFirmaRelease.cjs
          test -n "$APPLE_ID"
          test -n "$APPLE_APP_SPECIFIC_PASSWORD"
          test -n "$APPLE_TEAM_ID"
          xcrun notarytool --version
          npx electron-builder --mac --x64 --arm64 --publish never -c.forceCodeSigning=true -c.mac.notarize=true
          find release -maxdepth 2 -type d -name '*.app' -print | while IFS= read -r app; do
            codesign --verify --deep --strict "$app"
            xcrun stapler validate "$app"
            spctl --assess --type execute "$app"
          done
          test "$(find release -maxdepth 2 -type d -name '*.app' | wc -l | tr -d ' ')" = 2
          for dmg in release/*.dmg; do codesign --verify --strict "$dmg"; done
          npx ts-node --project tsconfig.node.json electron/updater/release/artefactos.ts macos release
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: |
            release/*.dmg
            release/*.zip
            release/*.yml
            release/*.blockmap
            release/signing.json
          if-no-files-found: error
          retention-days: 30

  publicar:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: release-production
    permissions:
      contents: write
      actions: read
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Promover exactamente los binarios probados del tag anotado
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run release:publish -- --promote
